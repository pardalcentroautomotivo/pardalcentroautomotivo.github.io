<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pardal | Pátio</title>
<meta name="theme-color" content="#16181b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>*{box-sizing:border-box}
/* Layout: quadro preto da oficina em tela cheia — 5 colunas fixas com cabeçalho laranja, cartões tipo post-it amarelo. Tema único escuro, como o quadro físico. */
:root{
  --quadro:#16181b; --coluna:#1e2125; --linha:#c8621a; --laranja:#e0731f;
  --postit:#f6e7a6; --postit-tx:#2a2618; --postit-sub:#6d6440;
  --tx:#eef0f2; --tx2:#9aa1a9; --ok:#2f9e5b; --alerta:#e3a21a; --atraso:#d64534;
  --f-titulo:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-texto:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
body{background:var(--quadro);color:var(--tx);font-family:var(--f-texto);margin:0;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px 12px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));box-sizing:border-box}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.marca{font-family:var(--f-titulo);font-weight:800;font-size:clamp(20px,2.2vw,30px);letter-spacing:.02em;text-transform:uppercase}
.marca span{color:var(--laranja)}
.demo{font-size:12px;color:var(--tx2);border:1px dashed #3a3f45;border-radius:6px;padding:2px 8px}
.leg{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.leg span{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--tx2)}
.relogio{font-family:var(--f-titulo);font-weight:700;font-size:clamp(22px,2.4vw,34px);font-variant-numeric:tabular-nums;min-width:4ch;text-align:right}
.bt{font:600 14px var(--f-texto);border-radius:8px;border:1px solid #3a3f45;background:#24282d;color:var(--tx);padding:8px 14px;cursor:pointer}
.bt:hover{border-color:var(--laranja)}
.bt.pri{background:var(--laranja);border-color:var(--laranja);color:#1b1006}
.bt:focus-visible,.card:focus-visible{outline:3px solid #fff;outline-offset:2px}
.quadro{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:2px solid #000;border-radius:6px;background:var(--coluna)}
.col{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:3px solid var(--linha)}
.col:last-child{border-right:0}
.col h2{margin:0;padding:10px 8px 8px;text-align:center;font:800 clamp(15px,1.5vw,22px)/1.05 var(--f-titulo);color:var(--laranja);text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid #2c3036}
.col h2 small{display:block;font-size:.7em;color:var(--tx2);font-weight:700;margin-top:2px}
.lista{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.col.sobre .lista{background:rgba(224,115,31,.08);outline:2px dashed var(--laranja);outline-offset:-6px}
.card{background:var(--postit);color:var(--postit-tx);border-radius:3px;padding:9px 10px 8px;box-shadow:0 2px 0 rgba(0,0,0,.35);cursor:grab;touch-action:none;user-select:none;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:start;position:relative}
.card .pl{font:800 clamp(17px,1.55vw,24px)/1 var(--f-titulo);letter-spacing:.04em}
.card .mod{font:700 clamp(13px,1.05vw,16px)/1.15 var(--f-texto);grid-column:1/-1}
.card .srv{font:500 clamp(12px,.95vw,14px)/1.2 var(--f-texto);color:var(--postit-sub);grid-column:1/-1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mec{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--f-titulo);color:#fff;letter-spacing:.02em;flex:0 0 auto}
.tempo{grid-column:1/-1;justify-self:start;margin-top:4px;font:700 13px var(--f-texto);font-variant-numeric:tabular-nums;border-radius:999px;padding:2px 9px;background:rgba(0,0,0,.08)}
.tempo.ok{color:#1d6b3e}
.tempo.alerta{background:var(--alerta);color:#2a1d00}
.tempo.atraso{background:var(--atraso);color:#fff;animation:pisca 1.6s ease-in-out infinite}
.parado{grid-column:1/-1;font-size:12px;color:var(--postit-sub)}
.card.atrasado{box-shadow:0 0 0 3px var(--atraso),0 2px 0 rgba(0,0,0,.35)}
@keyframes pisca{50%{opacity:.6}}
.fantasma{position:fixed;pointer-events:none;z-index:50;opacity:.92;transform:rotate(2deg);box-shadow:0 12px 24px rgba(0,0,0,.5)}
.vend{grid-column:1/-1;margin-top:4px;font:600 12px var(--f-texto);color:var(--postit-sub);border-top:1px dashed rgba(0,0,0,.18);padding-top:4px}
.vend.cobra{color:#fff;background:#2c5fb3;border-top:0;border-radius:6px;padding:3px 8px;justify-self:start;font-weight:700}
#f-pl{text-transform:uppercase;letter-spacing:.04em}
.barra{grid-column:1/-1;height:6px;border-radius:99px;background:rgba(0,0,0,.12);overflow:hidden;margin-top:5px}
.barra i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .6s ease}
.barra i.alerta{background:var(--alerta)}
.barra i.atraso{background:var(--atraso)}
.card.chama{animation:chama .9s ease-in-out infinite}
@keyframes chama{50%{transform:scale(1.035);box-shadow:0 0 0 4px #fff,0 0 22px rgba(255,255,255,.55)}}
@media (prefers-reduced-motion:reduce){.card.chama{animation:none;outline:4px solid #fff}}
.obrig{color:var(--laranja);font-weight:700}
.chips.falta{outline:2px solid var(--atraso);outline-offset:4px;border-radius:8px}
.vazio{color:#4a5058;font-size:13px;text-align:center;padding:14px 4px}
/* folha de edição */
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:60;padding:16px}
.folha{background:#22262b;border:1px solid #363b42;border-radius:12px;width:min(460px,100%);max-height:90%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.folha h3{margin:0;font:800 24px var(--f-titulo);text-transform:uppercase;color:var(--laranja)}
.folha label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--tx2);font-weight:600}
.folha input{font:600 16px var(--f-texto);background:#15181b;border:1px solid #3a3f45;border-radius:8px;color:var(--tx);padding:9px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 14px var(--f-texto);border-radius:999px;border:1px solid #3a3f45;background:#15181b;color:var(--tx);padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--laranja);background:#3a2410}
.chip .mec{width:20px;height:20px;font-size:10px}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.acoes .bt{flex:1}
.bt.del{background:transparent;color:#ff8a7a;border-color:#5a2c27}
.dica{font-size:12px;color:var(--tx2);margin:0}
@media (max-width:760px){
  body{overflow:auto}
  .app{height:auto}
  .quadro{grid-template-columns:repeat(5,minmax(220px,1fr));overflow-x:auto}
  .lista{max-height:none}
  .leg{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){.tempo.atraso{animation:none}}

.mec.mini{width:20px;height:20px;font-size:10px}
body.login .app,body.login{overflow:auto}
.caixa{max-width:420px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px;background:#22262b;border:1px solid #363b42;border-radius:12px;padding:22px;box-sizing:border-box}
#app{height:100%}
body.login #app,body:not(.estacao):not(.visao) #app{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.caixa label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--tx2);font-weight:600}
.caixa input{font:600 16px var(--f-texto);background:#15181b;border:1px solid #3a3f45;border-radius:8px;color:var(--tx);padding:10px}
.erro{background:#3a1814;border:1px solid #6b2a22;color:#ffb3a8;border-radius:8px;padding:8px 10px;font-size:14px}
.aviso{background:#3a2a0e;color:#ffd58a;border-radius:8px;padding:6px 10px;font-size:13px}
.dica.forte{font-size:15px;color:var(--tx)}
.acoes.col1{flex-direction:column}
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mrow input{font:600 15px var(--f-texto);background:#15181b;border:1px solid #3a3f45;border-radius:8px;color:var(--tx);padding:7px 9px;min-width:0}
.mrow #mn-n{flex:1 1 160px}
.mrow .sig{width:4.5em;text-transform:uppercase}
.mrow input[type=color]{width:44px;height:36px;padding:2px}
.mrow .chk{flex:1 1 140px;flex-direction:row!important;align-items:center;color:var(--tx)!important;font-size:15px!important}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#f1f3f5;color:#16181b;font-weight:700;padding:10px 16px;border-radius:10px;z-index:80;max-width:90%}
body.visao .card{cursor:pointer}
@media (max-width:760px){
  body.visao .quadro{display:flex;flex-direction:column;overflow:visible;border:0;background:none;gap:12px}
  body.visao .col{border-right:0;background:var(--coluna);border-radius:8px;border-top:3px solid var(--linha)}
  body.visao .lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  body.visao .relogio{display:none}
}
</style></head>
<body><div id="app"><div class="caixa"><div class="marca">Pardal <span>|</span> Pátio</div><p class="dica">Carregando…</p></div></div>
<script src="patio-supabase.js"></script>
<script src="patio-app.js"></script>
</body></html>
